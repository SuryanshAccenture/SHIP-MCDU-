name: Ship MCDU CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
      pages: write
      contents: read
      id-token: write

jobs:
  stage-1-checkout:
    name: 1️⃣ Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

  stage-2-validate-html:
    name: 2️⃣ Validate HTML Syntax
    runs-on: ubuntu-latest
    needs: stage-1-checkout
    steps:
      - uses: actions/checkout@v3

      - name: Install HTML tidy tool
        run: sudo apt-get install -y tidy

      - name: Run tidy to validate HTML
        run: |
          find ./docs -name '*.html' -exec tidy -qe {} \;

  stage-3-build:
    name: 3️⃣ Build Site
    runs-on: ubuntu-latest
    needs: stage-2-validate-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs 

  stage-4-deploy:
    needs: stage-3-build
    name: 4️⃣ Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
