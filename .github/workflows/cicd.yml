name: Ship MCDU CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-1-checkout:
    name: 1️⃣ Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

  stage-2-validate-html:
    name: 2️⃣ Validate HTML Syntax
    runs-on: ubuntu-latest
    needs: stage-1-checkout
    steps:
      - uses: actions/checkout@v3

      - name: Install HTML tidy tool
        run: sudo apt-get install -y tidy

      - name: Run tidy to validate HTML
        run: |
          find ./docs -name '*.html' -exec tidy -qe {} \;

  stage-3-build:
    name: 3️⃣ Build Site
    runs-on: ubuntu-latest
    needs: stage-2-validate-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
